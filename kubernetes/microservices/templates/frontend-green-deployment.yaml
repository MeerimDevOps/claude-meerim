apiVersion: apps/v1
kind: Deployment

metadata:
  name: frontend-green

spec:
  replicas: 2

  selector:
    matchLabels:
      app: frontend-service
      version: green

  template:
    metadata:
      labels:
        app: frontend-service
        version: green

    spec:
      containers:
      - name: frontend-container
        image: 230026708124.dkr.ecr.us-east-2.amazonaws.com/frontend-service:v2

        ports:
        - containerPort: 80

        env:
        - name: COURSE_API_URL
          valueFrom:
            configMapKeyRef:
              name: frontend-config
              key: COURSE_API_URL

        - name: STUDENT_API_URL
          valueFrom:
            configMapKeyRef:
              name: frontend-config
              key: STUDENT_API_URL
